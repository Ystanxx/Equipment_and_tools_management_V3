name: Regression checks
on:
  pull_request:
  push:
    branches: [main, codex/review-hardening]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:fixture-password@localhost:5432/postgres
      SECRET_KEY: disposable-ci-fixture-only
      SMTP_HOST: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.txt
      - run: bash -n scripts/update-equipment-app.sh
      - run: python -m unittest discover -s scripts/tests -v
      - run: python backend/scripts/test_isolated.py -q
      - run: node --test frontend/tests/*.test.cjs
